name: "translator"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  translate:
    if: >-
      github.repository == 'kitUIN/PicImageSearch' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: tisfeng/issues-translate-action@c23b39d03d0829323dc719ba0cf34a791675d21a # v2.9.3
        continue-on-error: true
        with:
          BOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_LOGIN_NAME: github-actions[bot]
          IS_MODIFY_TITLE: true
          PRIMARY_LANGUAGE: en
          SECONDARY_LANGUAGE: ""
          CUSTOM_BOT_NOTE: Bot automatically translated this content.
